# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: movie-review
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL # Neon の接続文字列 (postgresql://...?sslmode=require)
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
